# SITE CONFIGURATION
# Site without a subpath (GitHub Pages user site).
# Switch `url` to "https://anzhiganov.com" if you enable the custom domain
# (rename CNAME.bak to CNAME).
baseurl: ""
url: "https://vanzhiganov.github.io"

# THEME-SPECIFIC CONFIGURATION
theme_settings:
  # Meta
  title: vyacheslav anzhiganov
  avatar:
  favicon: assets/favicon.ico
  gravatar: # Email MD5 hash
  description: "vyacheslav anzhiganov - contacts and projects" # used by search engines

  # Header and footer text
  header_text:
  header_text_feature_image:
  footer_text: >
    &copy; vyacheslav anzhiganov

  # Icons
  rss: true
  email_address: "vanzhiganov@outlook.com"
  behance:
  bitbucket: "vanzhiganov"
  dribbble:
  facebook:
  flickr:
  gitlab: "vanzhiganov"
  github: "vanzhiganov"
  gitter:
  google_plus:
  instagram: "vanzhiganov"
  linkedin:  # Full URL
  pinterest:
  reddit:
  soundcloud:
  stack_exchange:  # Full URL
  steam:
  tumblr:
  twitter: "vanzhiganov"
  wordpress:
  youtube:

  # Scripts
  google_analytics: G-K30FWS29BC
  yandex_metrika: 27143651 # Yandex.Metrika counter ID
  disqus_shortname:
  katex: false # Enable if using math markup
  search: false # Enable the search feature

  # Localization strings
  str_follow_on: "Follow on"
  str_rss_follow: "Follow RSS feed"
  str_email: "Email"
  str_next_post: "Next post"
  str_previous_post: "Previous post"
  str_next_page: "Next"
  str_previous_page: "Prev"
  str_continue_reading: "Continue reading"
  str_javascript_required_disqus: "Please enable JavaScript to view comments."
  str_search_no_results: "No results found."

  # Colours, typography and padding
  # Open the "_sass > base" folder, and open "_variables.scss"
  google_fonts: "Source+Sans+Pro:400,700,700italic,400italic"

  # Post navigation
  post_navigation: false

  # Sort pages in the header navigation by their `order` front matter
  site_navigation_sort: "order"

# PAGINATION
paginate: 5
paginate_path: "blog/page:num"

# BUILD SETTINGS
markdown: kramdown
highlighter: rouge
sass:
  sass_dir: _sass
  style: :compressed
plugins: [jekyll-paginate]
exclude:
  - Gemfile
  - Gemfile.lock
